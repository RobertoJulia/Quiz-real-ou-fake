<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Fake ou verdade | Treino Inclusivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3ff; 
            --surface: #ffffff;
            --primary: #7c3aed; 
            --text: #1e1b4b;
            --text-light: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
            --shadow: 0 20px 40px -10px rgba(124, 58, 237, 0.1);
        }

        /* Modo Daltônico (Cores de Alto Contraste) */
        body.cb-mode {
            --success: #0072b2; /* Azul para Daltonismo */
            --error: #d55e00;   /* Laranja Vermelhado */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(at 0% 0%, #ede9fe 0, transparent 50%), radial-gradient(at 100% 100%, #fae8ff 0, transparent 50%);
        }

        .container {
            width: 100%; max-width: 440px; background: var(--surface); border-radius: 40px; padding: 35px;
            box-shadow: var(--shadow); border: 1px solid white; position: relative; text-align: center;
        }

        .settings-btn {
            position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; background: none; border: none; z-index: 10;
        }

        .btn {
            width: 100%; padding: 18px; border-radius: 20px; font-weight: 800; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 12px;
        }

        .btn-main { background: var(--primary); color: white; box-shadow: 0 8px 15px -5px rgba(124, 58, 237, 0.4); }
        .btn-main:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-outline { background: #f3f4f6; color: var(--text); border: 2px solid var(--border); }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }

        .modal-content {
            background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 350px; text-align: left;
        }

        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-weight: 600; }
        .toggle { width: 40px; height: 20px; background: #ddd; border-radius: 20px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle.active { background: var(--primary); }
        .toggle::after { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .toggle.active::after { left: 22px; }

        .progress-wrap { width: 100%; height: 8px; background: #f3f4f6; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        .hidden { display: none !important; }
        h1 { font-family: 'Space Grotesk'; font-size: 2.2rem; color: var(--primary); margin-bottom: 8px; }
        .subtitle { color: var(--text-light); font-size: 0.9rem; margin-bottom: 25px; }
        
        select { padding: 8px; border-radius: 10px; border: 1px solid var(--border); font-weight: 600; }
    </style>
</head>
<body>

    <button class="settings-btn" onclick="toggleModal()">⚙️</button>

    <div class="container">
        <!-- HOME -->
        <div id="scr-home">
            <div style="font-size: 50px; margin-bottom: 15px;">⚡</div>
            <h1 id="txt-title"> Fake ou verdade</h1>
            <p class="subtitle" id="txt-subtitle">Treino mental de elite. Prepare-se para o desafio!</p>
            <button class="btn btn-main" onclick="showLevels()" id="btn-start">INICIAR TREINO ➔</button>
            <button class="btn btn-outline" onclick="showRanking()" id="btn-rank">RANKING</button>
        </div>

        <!-- LEVELS -->
        <div id="scr-levels" class="hidden">
            <h2 id="txt-lvl-title" style="margin-bottom: 20px;">CATEGORIA</h2>
            <div class="level-card" style="border: 2px solid var(--border); padding: 15px; border-radius: 20px; margin-bottom: 10px; cursor: pointer;" onclick="startLevel('teen')">🌱 RECRUTA (10-18)</div>
            <div class="level-card" style="border: 2px solid var(--border); padding: 15px; border-radius: 20px; margin-bottom: 10px; cursor: pointer;" onclick="startLevel('adult')">💪 AGENTE (19-35)</div>
            <div class="level-card" style="border: 2px solid var(--border); padding: 15px; border-radius: 20px; margin-bottom: 10px; cursor: pointer;" onclick="startLevel('senior')">🏆 MESTRE (36+)</div>
        </div>

        <!-- QUIZ -->
        <div id="scr-quiz" class="hidden">
            <div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>
            <div id="q-text" style="font-size: 1.1rem; font-weight: 700; min-height: 100px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;"></div>
            <div id="q-actions">
                <button class="btn btn-choice" style="background: var(--success); color: white;" onclick="verify(true)" id="btn-true">VERDADEIRO</button>
                <button class="btn btn-choice" style="background: var(--error); color: white;" onclick="verify(false)" id="btn-fake">FAKE</button>
            </div>
            <div id="q-feedback" class="hidden">
                <div id="f-box" style="padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 2px solid;">
                    <h3 id="f-title"></h3>
                    <p id="f-desc" style="font-size: 0.85rem; margin-top: 5px;"></p>
                </div>
                <button class="btn btn-main" onclick="nextQuestion()" id="btn-next">PRÓXIMO ➔</button>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="scr-end" class="hidden">
            <h2>FIM DA SÉRIE</h2>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--primary);">0</div>
            <input type="text" id="player-name" placeholder="Seu Nome" style="width:100%; padding: 15px; border-radius: 15px; border: 2px solid var(--border); margin-bottom: 15px; text-align: center;">
            <button class="btn btn-main" onclick="saveScore()" id="btn-save">SALVAR</button>
        </div>

        <!-- RANKING -->
        <div id="scr-ranking" class="hidden">
            <h2 id="txt-rank">RANKING</h2>
            <div id="rank-list" style="text-align: left; padding: 15px; background: #f9fafb; border-radius: 20px; margin: 15px 0;"></div>
            <button class="btn btn-outline" onclick="location.reload()">VOLTAR</button>
        </div>
    </div>

    <!-- MODAL SETTINGS -->
    <div id="modal-settings" class="modal hidden" onclick="if(event.target == this) toggleModal()">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Ajustes</h2>
            <div class="setting-row">
                <span>Daltônico</span>
                <div id="toggle-cb" class="toggle" onclick="toggleColorblind()"></div>
            </div>
            <div class="setting-row">
                <span>Voz</span>
                <div id="toggle-voice" class="toggle" onclick="toggleVoice()"></div>
            </div>
            <div class="setting-row">
                <span>Idioma</span>
                <select id="lang-select" onchange="changeLang()">
                    <option value="pt">PT-BR</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button class="btn btn-main" onclick="toggleModal()">FECHAR</button>
        </div>
    </div>

    <script>
        const TRANSLATIONS = {
            pt: {
                title: " Fake ou verdade", subtitle: "Treino mental de elite. Prepare-se!", start: "INICIAR TREINO ➔", rank: "RANKING",
                true: "VERDADEIRO", fake: "FAKE", next: "PRÓXIMO ➔", save: "SALVAR", lvlTitle: "CATEGORIA",
                win: "BOA TÉCNICA!", loss: "PONTO FRACO!"
            },
            en: {
                title: " Fake or truth", subtitle: "Elite mental training. Get ready!", start: "START TRAINING ➔", rank: "LEADERBOARD",
                true: "TRUE", fake: "FAKE", next: "NEXT ➔", save: "SAVE", lvlTitle: "CATEGORY",
                win: "GOOD FORM!", loss: "WEAK SPOT!"
            }
        };

        const QUESTIONS = {
            teen: [
                {q: "Senhas com nomes de pets são fáceis de hackear.", qen: "Pet names as passwords are easy to hack.", a: true, d: "Invasores usam listas de palavras comuns.", den: "Hackers use lists of common words first."},
                {q: "Modo anônimo esconde dados do dono do Wi-Fi.", qen: "Incognito mode hides data from the Wi-Fi owner.", a: false, d: "O administrador ainda monitora o tráfego.", den: "Admin can still see the traffic."},
                {q: "Baixar jogos piratas pode instalar vírus.", qen: "Downloading pirated games can install viruses.", a: true, d: "Cracks costumam carregar malwares.", den: "Cracks often carry malware."},
                {q: "Links de Robux Grátis são seguros.", qen: "Free Robux links are safe.", a: false, d: "Ninguém dá itens caros de graça.", den: "No one gives expensive items for free."},
                {q: "Verificação em 2 etapas protege o WhatsApp.", qen: "2-step verification protects WhatsApp.", a: true, d: "É a barreira extra contra clones.", den: "It's the extra barrier against clones."}
            ],
            adult: [
                {q: "Bancos ligam pedindo senha por voz.", qen: "Banks call asking for passwords by voice.", a: false, d: "Bancos nunca pedem senhas.", den: "Banks never ask for passwords."},
                {q: "Cadeado verde garante site 100% honesto.", qen: "Green padlock guarantees 100% honest site.", a: false, d: "Garante apenas conexão segura.", den: "Only guarantees a secure connection."},
                {q: "Postar foto de passagens aéreas é perigoso.", qen: "Posting flight ticket photos is dangerous.", a: true, d: "O código de barras tem seus dados.", den: "Barcode contains your data."},
                {q: "Biometria é mais segura que PIN simples.", qen: "Biometrics is safer than a simple PIN.", a: true, d: "Digitais são únicas.", den: "Fingerprints are unique."},
                {q: "VPNs protegem dados em redes abertas.", qen: "VPNs protect data in open networks.", a: true, d: "Cria um túnel criptografado.", den: "Creates an encrypted tunnel."}
            ],
            senior: [
                {q: "Bancos mandam motoboy buscar cartões.", qen: "Banks send couriers to pick up cards.", a: false, d: "Isso é golpe! Jamais entregue.", den: "This is a scam! Never give it away."},
                {q: "SMS de conta bloqueada é sempre real.", qen: "SMS about blocked account is always real.", a: false, d: "É smishing para roubar dados.", den: "It's smishing to steal data."},
                {q: "Anotar senhas no monitor é seguro.", qen: "Writing passwords on the monitor is safe.", a: false, d: "Segurança física é essencial.", den: "Physical security is essential."},
                {q: "Atualizar o celular corrige falhas.", qen: "Updating the phone fixes flaws.", a: true, d: "Mantém seu sistema protegido.", den: "Keeps your system protected."},
                {q: "Promoções no Zap são quase sempre golpes.", qen: "WhatsApp promotions are mostly scams.", a: true, d: "Cuidado com links suspeitos.", den: "Beware of suspicious links."}
            ]
        };

        let state = { score: 0, idx: 0, pool: [], lang: 'pt', voice: false, cb: false };

        function toggleModal() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        
        function toggleColorblind() {
            state.cb = !state.cb;
            document.getElementById('toggle-cb').classList.toggle('active');
            document.body.classList.toggle('cb-mode');
        }

        function toggleVoice() {
            state.voice = !state.voice;
            document.getElementById('toggle-voice').classList.toggle('active');
        }

        function changeLang() {
            state.lang = document.getElementById('lang-select').value;
            const t = TRANSLATIONS[state.lang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('btn-rank').innerText = t.rank;
            document.getElementById('btn-true').innerText = t.true;
            document.getElementById('btn-fake').innerText = t.fake;
            document.getElementById('btn-next').innerText = t.next;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('txt-lvl-title').innerText = t.lvlTitle;
        }

        function speak(text) {
            if(!state.voice) return;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = state.lang === 'pt' ? 'pt-BR' : 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function showLevels() {
            document.getElementById('scr-home').classList.add('hidden');
            document.getElementById('scr-levels').classList.remove('hidden');
        }

        function startLevel(lvl) {
            state.pool = [...QUESTIONS[lvl]].sort(() => Math.random() - 0.5);
            state.idx = 0; state.score = 0;
            document.getElementById('scr-levels').classList.add('hidden');
            document.getElementById('scr-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.pool[state.idx];
            const text = state.lang === 'pt' ? q.q : q.qen;
            document.getElementById('p-bar').style.width = `${(state.idx / state.pool.length) * 100}%`;
            document.getElementById('q-text').innerText = text;
            document.getElementById('q-actions').classList.remove('hidden');
            document.getElementById('q-feedback').classList.add('hidden');
            speak(text);
        }

        function verify(val) {
            const q = state.pool[state.idx];
            const isCorrect = val === q.a;
            if(isCorrect) state.score++;

            document.getElementById('q-actions').classList.add('hidden');
            const fWrap = document.getElementById('q-feedback');
            const fTitle = document.getElementById('f-title');
            const fDesc = document.getElementById('f-desc');
            const t = TRANSLATIONS[state.lang];

            fWrap.classList.remove('hidden');
            fTitle.innerText = isCorrect ? t.win : t.loss;
            fDesc.innerText = state.lang === 'pt' ? q.d : q.den;
            
            const box = document.getElementById('f-box');
            box.style.borderColor = isCorrect ? "var(--success)" : "var(--error)";
            box.style.color = isCorrect ? "var(--success)" : "var(--error)";
            
            speak(fTitle.innerText + ". " + fDesc.innerText);
        }

        function nextQuestion() {
            state.idx++;
            if(state.idx < state.pool.length) renderQuestion();
            else showEnd();
        }

        function showEnd() {
            document.getElementById('scr-quiz').classList.add('hidden');
            document.getElementById('scr-end').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
        }

        function saveScore() {
            const name = document.getElementById('player-name').value || "Atleta";
            const ranking = JSON.parse(localStorage.getItem('fakeverdade_rank') || '[]');
            ranking.push({name, score: state.score, date: new Date().toLocaleDateString()});
            ranking.sort((a,b) => b.score - a.score);
            localStorage.setItem('fakeverdade_rank', JSON.stringify(ranking.slice(0, 5)));
            showRanking();
        }

        function showRanking() {
            document.getElementById('scr-home').classList.add('hidden');
            document.getElementById('scr-end').classList.add('hidden');
            document.getElementById('scr-ranking').classList.remove('hidden');
            const list = document.getElementById('rank-list');
            const ranking = JSON.parse(localStorage.getItem('fakeverdade_rank') || '[]');
            list.innerHTML = ranking.map((r,i) => `<div>${i+1}º ${r.name} - ${r.score} pts</div>`).join('');
        }
    </script>
</body>
</html>
