<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Defense Platinum | Treino Pesado</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfdfd;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #0f172a;
            --text-light: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, hsla(214,94%,89%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(214,94%,89%,1) 0, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 40px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,1);
            position: relative;
            text-align: center;
            animation: containerEntrance 0.8s cubic-bezier(0.2, 1, 0.2, 1);
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        .btn-main:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .btn-main:active { transform: translateY(2px) scale(0.98); }

        .btn-outline { background: #f1f5f9; color: var(--text); border: 2px solid var(--border); }
        .btn-choice { transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .btn-choice:hover { transform: scale(1.03); }

        .progress-wrap {
            width: 100%; height: 10px; background: #f1f5f9;
            border-radius: 20px; margin-bottom: 40px; overflow: hidden;
        }

        .progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa);
            width: 0%; border-radius: 20px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .level-card {
            background: white; border: 2px solid var(--border);
            padding: 25px 15px; border-radius: 28px; cursor: pointer;
            transition: 0.3s; margin-bottom: 15px; display: flex;
            align-items: center; justify-content: space-between; text-align: left;
        }

        .level-card:hover { border-color: var(--primary); transform: translateX(10px); }

        .feedback-pop {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 2px solid transparent;
        }

        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: scale(1); } }

        .hidden { display: none !important; }
        h1 { font-family: 'Space Grotesk'; font-size: 2.5rem; letter-spacing: -2px; margin-bottom: 10px; line-height: 1; }
        .subtitle { color: var(--text-light); font-size: 1rem; margin-bottom: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HOME -->
        <div id="scr-home">
            <div style="font-size: 55px; margin-bottom: 20px;">🛡️</div>
            <h1>CYBER<br>FITNESS</h1>
            <p class="subtitle">Série pesada: 10 questões por nível. Mantenha a postura e blinde seus dados.</p>
            <button class="btn btn-main" onclick="showLevels()">COMEÇAR TREINO ➔</button>
        </div>

        <!-- NÍVEIS -->
        <div id="scr-levels" class="hidden">
            <h2 style="margin-bottom: 25px; font-family: 'Space Grotesk';">CATEGORIA</h2>
            <div class="level-card" onclick="startLevel('teen')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">RECRUTA</div><div style="font-size: 0.8rem; color: var(--text-light);">Iniciante (10-18)</div></div>
                <span style="font-size: 1.5rem;">🌱</span>
            </div>
            <div class="level-card" onclick="startLevel('adult')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">AGENTE</div><div style="font-size: 0.8rem; color: var(--text-light);">Avançado (19-35)</div></div>
                <span style="font-size: 1.5rem;">💪</span>
            </div>
            <div class="level-card" onclick="startLevel('senior')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">MESTRE</div><div style="font-size: 0.8rem; color: var(--text-light);">Soberano (36+)</div></div>
                <span style="font-size: 1.5rem;">🏆</span>
            </div>
            <button class="btn btn-outline" style="margin-top: 15px;" onclick="location.reload()">VOLTAR</button>
        </div>

        <!-- QUIZ -->
        <div id="scr-quiz" class="hidden">
            <div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>
            <div id="q-text" style="font-size: 1.2rem; font-weight: 700; min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;"></div>
            
            <div id="q-actions">
                <button class="btn btn-choice" style="background: var(--success); color: white;" onclick="verify(true)">VERDADEIRO</button>
                <button class="btn btn-choice" style="background: var(--error); color: white;" onclick="verify(false)">FALSO</button>
            </div>

            <div id="q-feedback" class="hidden">
                <div id="feedback-box" class="feedback-pop">
                    <h3 id="f-title" style="margin-bottom: 8px;"></h3>
                    <p id="f-desc" style="font-size: 0.9rem; font-weight: 600;"></p>
                </div>
                <button class="btn btn-main" onclick="nextQuestion()">PRÓXIMO ROUND ➔</button>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="scr-end" class="hidden">
            <h2 style="color: var(--text-light); font-size: 0.9rem;">SÉRIE CONCLUÍDA</h2>
            <div id="final-score" style="font-size: 6rem; font-weight: 900; color: var(--primary); font-family: 'Space Grotesk';">0</div>
            <p id="final-msg" class="subtitle" style="margin-top: -10px; font-weight: 600;"></p>
            <button class="btn btn-main" onclick="location.reload()">REPETIR SÉRIE</button>
        </div>
    </div>

    <script>
        const QUESTIONS = {
            teen: [
                {q: "Mito ou Verdade: Senhas com nomes de pets são fáceis de hackear.", a: true, d: "Nomes comuns são as primeiras tentativas de invasores."},
                {q: "Mito ou Verdade: O modo anônimo esconde seus dados do dono do Wi-Fi.", a: false, d: "O administrador da rede ainda consegue ver o tráfego."},
                {q: "Mito ou Verdade: Baixar jogos piratas pode instalar vírus espiões.", a: true, d: "Arquivos modificados costumam carregar malwares ocultos."},
                {q: "Mito ou Verdade: Links de 'Robux Grátis' no Zap são seguros.", a: false, d: "É golpe para roubar sua conta ou dados pessoais."},
                {q: "Mito ou Verdade: A verificação em 2 etapas protege seu WhatsApp.", a: true, d: "É a melhor barreira contra clones e invasões."},
                {q: "Mito ou Verdade: Se você apagar uma foto da internet, ela some para sempre.", a: false, d: "Alguém pode ter feito print ou salvado em outro servidor."},
                {q: "Mito ou Verdade: Usar o mesmo e-mail e senha em todos os sites é perigoso.", a: true, d: "Se um site vazar, o hacker acessa todas as suas contas."},
                {q: "Mito ou Verdade: Hackers só atacam pessoas ricas e famosas.", a: false, d: "Qualquer pessoa com dados bobeando é um alvo potencial."},
                {q: "Mito ou Verdade: Aceitar solicitações de estranhos em jogos é arriscado.", a: true, d: "Podem ser perfis falsos tentando coletar informações."},
                {q: "Mito ou Verdade: Carregar o celular em USBs públicas pode roubar dados.", a: true, d: "Conhecido como 'Juice Jacking', cabos podem transferir dados."}
            ],
            adult: [
                {q: "Mito ou Verdade: Bancos ligam pedindo sua senha por segurança.", a: false, d: "Nenhuma instituição pede senha por voz ou chat."},
                {q: "Mito ou Verdade: O cadeado verde garante que o site é honesto.", a: false, d: "Garante apenas que a conexão é criptografada."},
                {q: "Mito ou Verdade: Postar foto da passagem aérea expõe seus dados.", a: true, d: "O código de barras contém dados sensíveis do seu perfil."},
                {q: "Mito ou Verdade: Salvar senhas no navegador é 100% seguro.", a: false, d: "Se alguém acessar seu dispositivo físico, pode ver as senhas."},
                {q: "Mito ou Verdade: Biometria é mais segura que senha de 4 dígitos.", a: true, d: "A digital é única e muito mais difícil de adivinhar."},
                {q: "Mito ou Verdade: Wi-Fi público de aeroporto é seguro para acessar banco.", a: false, d: "Redes abertas permitem interceptação de dados (Sniffing)."},
                {q: "Mito ou Verdade: PDF pode conter vírus que rouba seus arquivos.", a: true, d: "Scripts maliciosos podem ser embutidos em arquivos PDF."},
                {q: "Mito ou Verdade: Antivírus gratuito é suficiente para proteção total.", a: false, d: "Oferece proteção básica, mas não contra ameaças avançadas."},
                {q: "Mito ou Verdade: Ativar o 'Encontrar meu Dispositivo' ajuda na segurança.", a: true, d: "Permite bloquear e apagar dados remotamente em caso de roubo."},
                {q: "Mito ou Verdade: Usar VPN protege você em redes Wi-Fi desconhecidas.", a: true, d: "A VPN cria um túnel criptografado para seus dados."}
            ],
            senior: [
                {q: "Mito ou Verdade: O banco manda motoboy buscar seu cartão vencido.", a: false, d: "Isso é golpe! O banco nunca retira cartões na sua casa."},
                {q: "Mito ou Verdade: Se um neto pede dinheiro por número novo, ligue por vídeo.", a: true, d: "Sempre confirme a identidade antes de qualquer PIX."},
                {q: "Mito ou Verdade: E-mail da Receita Federal pedindo clique é real.", a: false, d: "Órgãos oficiais não enviam links de cobrança por e-mail."},
                {q: "Mito ou Verdade: Promoções de sorteio no Zap costumam ser golpes.", a: true, d: "São iscas para roubar dados ou clonar o WhatsApp."},
                {q: "Mito ou Verdade: Deixar o celular sem senha facilita roubos de banco.", a: true, d: "A senha de tela é a sua primeira linha de defesa."},
                {q: "Mito ou Verdade: Atualizar o celular deixa ele lento e não serve pra nada.", a: false, d: "Atualizações corrigem falhas graves de segurança."},
                {q: "Mito ou Verdade: SMS dizendo que sua conta foi bloqueada é suspeito.", a: true, d: "Geralmente é 'smishing' para roubar sua senha bancária."},
                {q: "Mito ou Verdade: Você deve anotar suas senhas em um papel e colar no monitor.", a: false, d: "Qualquer pessoa que passar por perto terá acesso total."},
                {q: "Mito ou Verdade: Compras online devem ser feitas apenas em sites conhecidos.", a: true, d: "Sites desconhecidos podem ser fakes criados para roubar cartões."},
                {q: "Mito ou Verdade: Compartilhar 'correntes' pode espalhar links maliciosos.", a: true, d: "Muitas correntes escondem links que instalam vírus."}
            ]
        };

        let state = { score: 0, idx: 0, pool: [] };

        function showLevels() {
            document.getElementById('scr-home').classList.add('hidden');
            document.getElementById('scr-levels').classList.remove('hidden');
        }

        function startLevel(lvl) {
            state.pool = [...QUESTIONS[lvl]].sort(() => Math.random() - 0.5);
            state.idx = 0; 
            state.score = 0;
            document.getElementById('scr-levels').classList.add('hidden');
            document.getElementById('scr-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.pool[state.idx];
            document.getElementById('p-bar').style.width = `${(state.idx / state.pool.length) * 100}%`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-actions').classList.remove('hidden');
            document.getElementById('q-feedback').classList.add('hidden');
        }

        function verify(val) {
            const q = state.pool[state.idx];
            const win = val === q.a;
            if(win) state.score++;
            
            document.getElementById('q-actions').classList.add('hidden');
            const fWrap = document.getElementById('q-feedback');
            const fBox = document.getElementById('feedback-box');
            const fTitle = document.getElementById('f-title');
            
            fWrap.classList.remove('hidden');
            fTitle.innerText = win ? "BOA FORMA! ✅" : "FALHA NA TÉCNICA! ❌";
            fBox.style.background = win ? "#ecfdf5" : "#fef2f2";
            fBox.style.color = win ? "#065f46" : "#991b1b";
            fBox.style.borderColor = win ? "#10b981" : "#ef4444";
            
            document.getElementById('f-desc').innerText = (win ? "Isso mesmo! " : "Atenção: ") + q.d;
        }

        function nextQuestion() {
            state.idx++;
            if(state.idx < state.pool.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('scr-quiz').classList.add('hidden');
            document.getElementById('scr-end').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            document.getElementById('final-msg').innerText = state.score >= 8 ? "Mente de Titã. Defesa impenetrável." : "Treino bom, mas precisa de mais reps para trincar.";
        }
    </script>
</body>
</html>
