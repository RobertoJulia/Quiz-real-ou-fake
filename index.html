<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fake ou Verdade | Treino de Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Fundo lilás bem claro para foco total */
            --bg: #f5f3ff; 
            --surface: #ffffff;
            --primary: #7c3aed; /* Roxo vibrante para combinar */
            --primary-hover: #6d28d9;
            --text: #1e1b4b;
            --text-light: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
            --shadow: 0 20px 40px -10px rgba(124, 58, 237, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Gradiente suave lilás */
            background-image: 
                radial-gradient(at 0% 0%, #ede9fe 0, transparent 50%), 
                radial-gradient(at 100% 100%, #fae8ff 0, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 40px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,1);
            position: relative;
            text-align: center;
            animation: containerEntrance 0.8s cubic-bezier(0.2, 1, 0.2, 1);
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.3);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); }
            100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }

        .btn-main:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .btn-main:active { transform: translateY(2px) scale(0.98); }

        .btn-outline { background: #f3f4f6; color: var(--text); border: 2px solid var(--border); }
        .btn-choice { transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .btn-choice:hover { transform: scale(1.03); }

        .progress-wrap {
            width: 100%; height: 10px; background: #f3f4f6;
            border-radius: 20px; margin-bottom: 40px; overflow: hidden;
        }

        .progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--primary), #a78bfa);
            width: 0%; border-radius: 20px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .level-card {
            background: white; border: 2px solid var(--border);
            padding: 25px 15px; border-radius: 28px; cursor: pointer;
            transition: 0.3s; margin-bottom: 15px; display: flex;
            align-items: center; justify-content: space-between; text-align: left;
        }

        .level-card:hover { border-color: var(--primary); transform: translateX(10px); background: #fdfcff; }

        .feedback-pop {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 2px solid transparent;
        }

        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: scale(1); } }

        .hidden { display: none !important; }
        h1 { font-family: 'Space Grotesk'; font-size: 2.5rem; letter-spacing: -2px; margin-bottom: 10px; line-height: 1; color: var(--primary); }
        .subtitle { color: var(--text-light); font-size: 1rem; margin-bottom: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HOME -->
        <div id="scr-home">
            <div style="font-size: 55px; margin-bottom: 20px;">⚡</div>
            <h1>FAKE OU<br>VERDADE</h1>
            <p class="subtitle">Desafio de segurança digital. Treine sua percepção para não cair em ciladas!</p>
            <button class="btn btn-main" onclick="showLevels()">INICIAR DESAFIO ➔</button>
        </div>

        <!-- NÍVEIS -->
        <div id="scr-levels" class="hidden">
            <h2 style="margin-bottom: 25px; font-family: 'Space Grotesk';">CATEGORIA</h2>
            <div class="level-card" onclick="startLevel('teen')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">RECRUTA</div><div style="font-size: 0.8rem; color: var(--text-light);">Iniciante (10-18)</div></div>
                <span style="font-size: 1.5rem;">🌱</span>
            </div>
            <div class="level-card" onclick="startLevel('adult')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">AGENTE</div><div style="font-size: 0.8rem; color: var(--text-light);">Avançado (19-35)</div></div>
                <span style="font-size: 1.5rem;">💪</span>
            </div>
            <div class="level-card" onclick="startLevel('senior')">
                <div><div style="font-weight: 800; font-size: 1.1rem;">MESTRE</div><div style="font-size: 0.8rem; color: var(--text-light);">Soberano (36+)</div></div>
                <span style="font-size: 1.5rem;">🏆</span>
            </div>
            <button class="btn btn-outline" style="margin-top: 15px;" onclick="location.reload()">VOLTAR</button>
        </div>

        <!-- QUIZ -->
        <div id="scr-quiz" class="hidden">
            <div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>
            <div id="q-text" style="font-size: 1.2rem; font-weight: 700; min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--text);"></div>
            
            <div id="q-actions">
                <button class="btn btn-choice" style="background: var(--success); color: white;" onclick="verify(true)">VERDADEIRO</button>
                <button class="btn btn-choice" style="background: var(--error); color: white;" onclick="verify(false)">FAKE</button>
            </div>

            <div id="q-feedback" class="hidden">
                <div id="feedback-box" class="feedback-pop">
                    <h3 id="f-title" style="margin-bottom: 8px;"></h3>
                    <p id="f-desc" style="font-size: 0.9rem; font-weight: 600;"></p>
                </div>
                <button class="btn btn-main" onclick="nextQuestion()">PRÓXIMO ROUND ➔</button>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="scr-end" class="hidden">
            <h2 style="color: var(--text-light); font-size: 0.9rem;">TREINO FINALIZADO</h2>
            <div id="final-score" style="font-size: 6rem; font-weight: 900; color: var(--primary); font-family: 'Space Grotesk';">0</div>
            <p id="final-msg" class="subtitle" style="margin-top: -10px; font-weight: 600;"></p>
            <button class="btn btn-main" onclick="location.reload()">REPETIR SÉRIE</button>
        </div>
    </div>

    <script>
        const QUESTIONS = {
            teen: [
                {q: "Senhas com nomes de pets são fáceis de hackear.", a: true, d: "Invasores usam listas de palavras comuns primeiro."},
                {q: "O modo anônimo esconde seus dados do dono do Wi-Fi.", a: false, d: "O administrador da rede ainda monitora o tráfego."},
                {q: "Baixar jogos piratas pode instalar vírus no PC ou celular.", a: true, d: "Arquivos 'crackeados' costumam carregar malwares."},
                {q: "Links de 'Robux ou V-Bucks Grátis' costumam ser golpes.", a: true, d: "Ninguém dá itens caros de graça em troca de cliques."},
                {q: "A verificação em 2 etapas protege seu WhatsApp de clones.", a: true, d: "É a barreira extra que impede o roubo da conta."},
                {q: "Se você apagar uma foto da internet, ela some para sempre.", a: false, d: "Prints e backups mantêm a foto viva em outros lugares."},
                {q: "Usar a mesma senha para tudo é uma boa prática.", a: false, d: "Se uma conta vazar, todas as outras caem juntas."},
                {q: "Qualquer pessoa com dados bobeando é um alvo potencial.", a: true, d: "Hackers automatizam ataques para atingir qualquer um."},
                {q: "Aceitar estranhos em jogos online é 100% seguro.", a: false, d: "Podem ser perfis falsos tentando coletar informações."},
                {q: "Carregar o celular em USBs públicas pode expor seus dados.", a: true, d: "USB transfere energia e dados; use apenas tomadas."}
            ],
            adult: [
                {q: "Bancos ligam pedindo sua senha por segurança.", a: false, d: "Bancos nunca pedem senhas por voz ou chat."},
                {q: "O cadeado verde garante que o site é 100% honesto.", a: false, d: "Garante apenas que a conexão é criptografada."},
                {q: "Postar foto da passagem aérea expõe dados sensíveis.", a: true, d: "O código de barras tem seu perfil de passageiro."},
                {q: "Salvar senhas no navegador é totalmente à prova de falhas.", a: false, d: "Se o PC for acessado fisicamente, as senhas aparecem."},
                {q: "Biometria é mais segura que PIN de 4 dígitos simples.", a: true, d: "Impressões digitais são exclusivas e complexas."},
                {q: "Wi-Fi de aeroporto é seguro para transações bancárias.", a: false, d: "Redes abertas facilitam o roubo de dados no ar."},
                {q: "Arquivos PDF podem esconder vírus para roubar arquivos.", a: true, d: "Scripts maliciosos rodam dentro de documentos."},
                {q: "Antivírus grátis oferece proteção total contra ataques.", a: false, d: "Oferece o básico, mas não contra ameaças de elite."},
                {q: "O 'Encontrar meu Dispositivo' ajuda na segurança remota.", a: true, d: "Permite apagar tudo se o celular for roubado."},
                {q: "VPNs criam um túnel criptografado para seus dados.", a: true, d: "Protege sua navegação em redes desconhecidas."}
            ],
            senior: [
                {q: "O banco manda motoboy buscar cartão na sua casa.", a: false, d: "Isso é golpe! Bancos não retiram cartões."},
                {q: "Parentes pedindo dinheiro por número novo: confirme por vídeo.", a: true, d: "Videochamada evita cair no golpe do perfil clonado."},
                {q: "E-mails da Receita Federal pedindo cliques são confiáveis.", a: false, d: "Órgãos oficiais não mandam links de cobrança assim."},
                {q: "Promoções incríveis no WhatsApp são quase sempre golpes.", a: true, d: "São iscas para roubar dados de quem clica."},
                {q: "Celular sem senha facilita o acesso de ladrões ao banco.", a: true, d: "A senha de tela é o seu escudo primário."},
                {q: "Atualizações do celular corrigem falhas graves de segurança.", a: true, d: "Mantenha o sistema sempre na última versão."},
                {q: "SMS dizendo que sua conta foi bloqueada é suspeito.", a: true, d: "É 'smishing' tentando roubar seus dados de login."},
                {q: "Anotar senhas no monitor é seguro se ninguém entrar na sala.", a: false, d: "Segurança física é parte da segurança digital."},
                {q: "Compre apenas em sites conhecidos e com boa reputação.", a: true, d: "Sites fakes são criados só para clonar cartões."},
                {q: "Compartilhar correntes pode espalhar vírus silenciosos.", a: true, d: "Links em correntes costumam ser maliciosos."}
            ]
        };

        let state = { score: 0, idx: 0, pool: [] };

        function showLevels() {
            document.getElementById('scr-home').classList.add('hidden');
            document.getElementById('scr-levels').classList.remove('hidden');
        }

        function startLevel(lvl) {
            state.pool = [...QUESTIONS[lvl]].sort(() => Math.random() - 0.5);
            state.idx = 0; 
            state.score = 0;
            document.getElementById('scr-levels').classList.add('hidden');
            document.getElementById('scr-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.pool[state.idx];
            document.getElementById('p-bar').style.width = `${(state.idx / state.pool.length) * 100}%`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-actions').classList.remove('hidden');
            document.getElementById('q-feedback').classList.add('hidden');
        }

        function verify(val) {
            const q = state.pool[state.idx];
            const win = val === q.a;
            if(win) state.score++;
            
            document.getElementById('q-actions').classList.add('hidden');
            const fWrap = document.getElementById('q-feedback');
            const fBox = document.getElementById('feedback-box');
            const fTitle = document.getElementById('f-title');
            
            fWrap.classList.remove('hidden');
            fTitle.innerText = win ? "BOA TÉCNICA! ✅" : "PONTO FRACO! ❌";
            fBox.style.background = win ? "#f0fdf4" : "#fef2f2";
            fBox.style.color = win ? "#166534" : "#991b1b";
            fBox.style.borderColor = win ? "#22c55e" : "#ef4444";
            
            document.getElementById('f-desc').innerText = (win ? "Exato! " : "Fique atento: ") + q.d;
        }

        function nextQuestion() {
            state.idx++;
            if(state.idx < state.pool.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('scr-quiz').classList.add('hidden');
            document.getElementById('scr-end').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            document.getElementById('final-msg').innerText = state.score >= 8 ? "Mente Blindada! Domínio total do movimento." : "Continue treinando para trincar sua segurança.";
        }
    </script>
</body>
</html>
