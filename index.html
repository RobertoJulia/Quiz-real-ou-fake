<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Defense | Platinum Animated</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #fdfdfd;
            --card-white: #ffffff;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, hsla(214,94%,89%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(214,94%,89%,1) 0, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-white);
            border-radius: 40px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,1);
            position: relative;
            text-align: center;
            animation: containerEntrance 0.8s cubic-bezier(0.2, 1, 0.2, 1);
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ANIMAÇÕES DE BOTÃO - O FOCO AQUI */
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }

        /* Efeito de Pulso Constante no Botão Principal */
        .btn-main {
            background: var(--accent);
            color: white;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        .btn-main:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
            letter-spacing: 1px;
        }

        .btn-main:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 1px 0px rgba(0,0,0,0.2);
        }

        /* Botão Fantasma com Animação de Borda */
        .btn-ghost {
            background: white;
            color: var(--accent);
            border: 2px solid var(--border);
            margin-top: 15px;
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            transform: translateX(5px);
        }

        /* Efeito de Clique no Quiz */
        .choice-row {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-choice {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-choice:hover {
            transform: scale(1.05);
        }

        /* Progress Bar Animada */
        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #f1f5f9;
            border-radius: 20px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            width: 0%;
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Feedback Pop */
        .feedback-pop {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px;
            border-radius: 24px;
            background: #f8fafc;
            margin-bottom: 20px;
            border: 2px dashed var(--border);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Estilo das Cartas de Nível */
        .level-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .level-card {
            background: white;
            border: 2px solid var(--border);
            padding: 25px 15px;
            border-radius: 28px;
            cursor: pointer;
            transition: 0.3s;
        }

        .level-card:hover {
            border-color: var(--accent);
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.1);
        }

        .hidden { display: none !important; }

        h1 { font-family: 'Space Grotesk'; font-size: 2.5rem; letter-spacing: -2px; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 40px; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- TELA INICIAL -->
        <div id="scr-start">
            <div style="font-size: 50px; margin-bottom: 20px; animation: float 3s infinite ease-in-out;">🛡️</div>
            <h1>CYBER<br>FITNESS</h1>
            <p class="subtitle">Blindagem digital em 10 movimentos. Treine sua mente para o Handstand da segurança.</p>
            <button class="btn btn-main" onclick="showLevels()">COMEÇAR SÉRIE ➔</button>
        </div>

        <!-- SELEÇÃO DE NÍVEL -->
        <div id="scr-levels" class="hidden">
            <h2 style="margin-bottom: 25px;">Escolha o Peso</h2>
            <div class="level-grid">
                <div class="level-card" onclick="startLevel('teen')">
                    <div style="font-size: 30px; margin-bottom: 10px;">👶</div>
                    <div style="font-weight: 800;">RECRUTA</div>
                    <div style="font-size: 12px; color: var(--text-muted);">10-18 anos</div>
                </div>
                <div class="level-card" onclick="startLevel('adult')">
                    <div style="font-size: 30px; margin-bottom: 10px;">💪</div>
                    <div style="font-weight: 800;">ATLETA</div>
                    <div style="font-size: 12px; color: var(--text-muted);">19-35 anos</div>
                </div>
                <div class="level-card" style="grid-column: span 2;" onclick="startLevel('senior')">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                        <span style="font-size: 40px;">👴</span>
                        <div style="text-align: left;">
                            <div style="font-weight: 800;">MESTRE</div>
                            <div style="font-size: 12px; color: var(--text-muted);">36+ anos</div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn btn-ghost" onclick="location.reload()">VOLTAR</button>
        </div>

        <!-- QUIZ -->
        <div id="scr-quiz" class="hidden">
            <div class="progress-wrap"><div class="progress-bar" id="p-bar"></div></div>
            <div id="q-text" style="font-size: 1.3rem; font-weight: 700; min-height: 120px; display: flex; align-items: center; justify-content: center;"></div>
            
            <div id="q-actions" class="choice-row">
                <button class="btn btn-choice" style="background: var(--success); color: white;" onclick="verify(true)">VERDADEIRO</button>
                <button class="btn btn-choice" style="background: var(--error); color: white;" onclick="verify(false)">FALSO</button>
            </div>

            <div id="q-feedback" class="hidden">
                <div class="feedback-pop">
                    <h3 id="f-title" style="margin-bottom: 8px; font-size: 1.2rem;"></h3>
                    <p id="f-desc" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;"></p>
                </div>
                <button class="btn btn-main" onclick="nextQuestion()">PRÓXIMO ROUND ➔</button>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="scr-end" class="hidden">
            <h2 style="color: var(--text-muted);">TREINO CONCLUÍDO</h2>
            <div id="final-score" style="font-size: 6rem; font-weight: 900; color: var(--accent); font-family: 'Space Grotesk';">0</div>
            <p id="final-msg" class="subtitle" style="margin-top: -10px;"></p>
            <button class="btn btn-main" onclick="location.reload()">REPETIR SÉRIE</button>
        </div>

    </div>

    <script>
        const DATA = {
            teen: [
                {q: "Mito ou Verdade: Senhas com nomes de pets são fáceis de hackear.", a: true, r: "Verdadeiro!", d: "Nomes comuns são as primeiras tentativas de invasores."},
                {q: "Mito ou Verdade: O modo anônimo esconde seus dados do Google.", a: false, r: "Falso!", d: "O anonimato é só no seu histórico local."},
                {q: "Mito ou Verdade: Baixar jogos piratas pode instalar vírus espiões.", a: true, r: "Verdadeiro!", d: "Arquivos modificados costumam carregar malwares."},
                {q: "Mito ou Verdade: Links de 'Robux Grátis' no Zap são seguros.", a: false, r: "Falso!", d: "É golpe para roubar sua conta ou dados."},
                {q: "Mito ou Verdade: Se apagar a foto do Instagram, ela some da internet.", a: false, r: "Falso!", d: "Prints e servidores mantêm cópias para sempre."},
                {q: "Mito ou Verdade: A verificação em 2 etapas protege seu WhatsApp.", a: true, r: "Verdadeiro!", d: "É a melhor barreira contra clones."},
                {q: "Mito ou Verdade: Usar Wi-Fi de shopping é arriscado para o banco.", a: true, r: "Verdadeiro!", d: "Dados podem ser interceptados em redes abertas."},
                {q: "Mito ou Verdade: Hackers só atacam empresas grandes.", a: false, r: "Falso!", d: "Qualquer pessoa descuidada é um alvo fácil."},
                {q: "Mito ou Verdade: Sua senha deve ter símbolos como @ e #.", a: true, r: "Verdadeiro!", d: "Aumenta muito o tempo de quebra da senha."},
                {q: "Mito ou Verdade: Cyberbullying pode gerar processos reais.", a: true, r: "Verdadeiro!", d: "A lei também vale para o mundo digital."}
            ],
            adult: [
                {q: "Mito ou Verdade: Bancos ligam pedindo sua senha por segurança.", a: false, r: "Falso!", d: "Nenhuma instituição pede senha por voz ou chat."},
                {q: "Mito ou Verdade: PDF pode conter vírus que rouba seus arquivos.", a: true, r: "Verdadeiro!", d: "Arquivos maliciosos infectam ao abrir."},
                {q: "Mito ou Verdade: O cadeado verde garante que o site é honesto.", a: false, r: "Falso!", d: "Garante apenas que a conexão é criptografada."},
                {q: "Mito ou Verdade: Postar foto da passagem aérea expõe seus dados.", a: true, r: "Verdadeiro!", d: "O código de barras tem dados do seu perfil."},
                {q: "Mito ou Verdade: Criptomoedas são impossíveis de rastrear.", a: false, r: "Falso!", d: "A blockchain é um livro público de transações."},
                {q: "Mito ou Verdade: Atualizar o celular protege contra espiões.", a: true, r: "Verdadeiro!", d: "Atualizações corrigem falhas de segurança."},
                {q: "Mito ou Verdade: Salvar senhas no navegador é 100% seguro.", a: false, r: "Falso!", d: "Qualquer um no seu PC pode ver essas senhas."},
                {q: "Mito ou Verdade: Bluetooth ligado em público facilita invasões.", a: true, r: "Verdadeiro!", d: "Permite tentativas de pareamento indesejados."},
                {q: "Mito ou Verdade: Empréstimo com taxa antecipada é golpe.", a: true, r: "Verdadeiro!", d: "Bancos sérios nunca cobram para liberar crédito."},
                {q: "Mito ou Verdade: Biometria é mais segura que senha de 4 dígitos.", a: true, r: "Verdadeiro!", d: "A digital é única e muito difícil de adivinhar."}
            ],
            senior: [
                {q: "Mito ou Verdade: O banco manda motoboy buscar seu cartão.", a: false, r: "Falso!", d: "Isso é um golpe. Corte o chip se o cartão vencer."},
                {q: "Mito ou Verdade: Se um neto pede dinheiro por número novo, ligue antes.", a: true, r: "Verdadeiro!", d: "Confirme sempre por voz ou vídeo a identidade."},
                {q: "Mito ou Verdade: Promoções de sorteio no Zap costumam ser golpes.", a: true, r: "Verdadeiro!", d: "Iscas para roubar dados ou clonar o Zap."},
                {q: "Mito ou Verdade: E-mail da Receita Federal pedindo clique é real.", a: false, r: "Falso!", d: "Órgãos oficiais não mandam links por e-mail."},
                {q: "Mito ou Verdade: Deixar o celular sem senha é um risco alto.", a: true, r: "Verdadeiro!", d: "Facilita o acesso a bancos em caso de perda."},
                {q: "Mito ou Verdade: Antivírus gratuito ajuda a proteger o celular.", a: true, r: "Verdadeiro!", d: "Oferece uma camada básica de proteção."},
                {q: "Mito ou Verdade: Fotos postadas no Facebook são invisíveis a estranhos.", a: false, r: "Falso!", d: "Depende da sua configuração de privacidade."},
                {q: "Mito ou Verdade: Sites de compras muito baratos podem ser falsos.", a: true, r: "Verdadeiro!", d: "Sempre verifique a reputação da loja."},
                {q: "Mito ou Verdade: O chip do cartão é impossível de clonar.", a: false, r: "Falso!", d: "É muito difícil, mas não impossível. Cuidado ao inserir."},
                {q: "Mito ou Verdade: Sua intuição ajuda a detectar mentiras online.", a: true, r: "Verdadeiro!", d: "Se algo parece bom demais para ser verdade, desconfie."}
            ]
        };

        let state = { score: 0, idx: 0, pool: [] };

        function showLevels() {
            document.getElementById('scr-start').classList.add('hidden');
            document.getElementById('scr-levels').classList.remove('hidden');
        }

        function startLevel(lvl) {
            state.pool = [...DATA[lvl]].sort(() => Math.random() - 0.5);
            state.idx = 0; state.score = 0;
            document.getElementById('scr-levels').classList.add('hidden');
            document.getElementById('scr-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.pool[state.idx];
            document.getElementById('p-bar').style.width = `${(state.idx / state.pool.length) * 100}%`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-actions').classList.remove('hidden');
            document.getElementById('q-feedback').classList.add('hidden');
        }

        function verify(val) {
            const q = state.pool[state.idx];
            const win = val === q.a;
            if(win) state.score++;
            
            document.getElementById('q-actions').classList.add('hidden');
            document.getElementById('q-feedback').classList.remove('hidden');
            
            const t = document.getElementById('f-title');
            t.innerText = win ? "PERFEITO! ✅" : "VIOLAÇÃO! ❌";
            t.style.color = win ? "var(--success)" : "var(--error)";
            document.getElementById('f-desc').innerText = q.r + " " + q.d;
        }

        function nextQuestion() {
            state.idx++;
            if(state.idx < state.pool.length) renderQuestion();
            else {
                document.getElementById('scr-quiz').classList.add('hidden');
                document.getElementById('scr-end').classList.remove('hidden');
                document.getElementById('final-score').innerText = state.score;
                document.getElementById('final-msg').innerText = state.score >= 8 ? "Mente de Titã. Defesa impenetrável." : "Treino bom, mas precisa de mais definição.";
            }
        }
    </script>
</body>
</html>
