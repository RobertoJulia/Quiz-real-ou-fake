<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Cyber Defense | Platinum Fix</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #0f172a;
            --text-light: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #e2e8f0;
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 32px 32px;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Space Grotesk'; font-size: 2.5rem; line-height: 1; margin-bottom: 15px; letter-spacing: -2px; }
        .subtitle { color: var(--text-light); margin-bottom: 35px; font-size: 1rem; }

        .btn {
            width: 100%;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .btn-primary { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-primary:active { transform: scale(0.95); }

        .btn-outline { background: #f1f5f9; color: var(--text); border: 2px solid var(--border); }
        .btn-outline:hover { background: #e2e8f0; }

        .card-level {
            background: white;
            border: 2px solid var(--border);
            padding: 22px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-level:hover { border-color: var(--primary); transform: scale(1.02); }

        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

        .feedback {
            padding: 25px;
            border-radius: var(--radius);
            margin: 20px 0;
            font-weight: 700;
            display: none;
            animation: pop 0.3s ease;
        }

        @keyframes pop { from { transform: scale(0.9); } to { transform: scale(1); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- TELA INICIAL -->
        <div id="scr-home">
            <div style="font-size: 60px; margin-bottom: 20px;">🛡️</div>
            <h1>TREINO<br>DIGITAL</h1>
            <p class="subtitle">Blindagem total contra fraudes. Aprenda a defender seus dados como um atleta mestre.</p>
            <button class="btn btn-primary" onclick="changeScreen('scr-home', 'scr-levels')">COMEÇAR SÉRIE</button>
        </div>

        <!-- TELA NÍVEIS -->
        <div id="scr-levels" class="hidden">
            <h2 style="margin-bottom: 25px; font-family: 'Space Grotesk';">CATEGORIA</h2>
            <div class="card-level" onclick="startLevel('teen')">
                <span>🌱 RECRUTA (10-18)</span>
                <span>➔</span>
            </div>
            <div class="card-level" onclick="startLevel('adult')">
                <span>🔥 AGENTE (19-35)</span>
                <span>➔</span>
            </div>
            <div class="card-level" onclick="startLevel('senior')">
                <span>🏆 MESTRE (36+)</span>
                <span>➔</span>
            </div>
            <button class="btn btn-outline" onclick="changeScreen('scr-levels', 'scr-home')">VOLTAR</button>
        </div>

        <!-- TELA QUIZ -->
        <div id="scr-quiz" class="hidden">
            <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>
            <div id="q-text" style="font-size: 1.2rem; font-weight: 700; min-height: 100px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;"></div>
            
            <div id="q-btns">
                <button class="btn btn-primary" style="background: var(--success);" onclick="handleAnswer(true)">VERDADEIRO</button>
                <button class="btn btn-primary" style="background: var(--error);" onclick="handleAnswer(false)">FALSO</button>
            </div>

            <div id="q-feedback" class="feedback">
                <div id="f-msg"></div>
                <button class="btn btn-primary" style="margin-top: 15px;" onclick="nextStep()">CONTINUAR ➔</button>
            </div>
        </div>

        <!-- TELA FIM -->
        <div id="scr-end" class="hidden">
            <h2 style="color: var(--text-light);">ROUND FINALIZADO</h2>
            <div id="f-score" style="font-size: 6rem; font-weight: 900; color: var(--primary); font-family: 'Space Grotesk';">0</div>
            <p id="f-quote" class="subtitle"></p>
            <button class="btn btn-primary" onclick="location.reload()">REPETIR TREINO</button>
        </div>
    </div>

    <script>
        const QUESTIONS = {
            teen: [
                {q: "Mito ou Verdade: Senhas com nomes de pets são fáceis de hackear.", a: true, d: "Nomes comuns são fáceis de adivinhar por algoritmos."},
                {q: "Mito ou Verdade: O modo anônimo esconde sua navegação do Wi-Fi.", a: false, d: "O administrador da rede ainda vê tudo."}
            ],
            adult: [
                {q: "Mito ou Verdade: Bancos pedem token por telefone para 'segurança'.", a: false, d: "Bancos nunca pedem senhas ou tokens por voz."},
                {q: "Mito ou Verdade: O cadeado verde garante que o site é seguro.", a: false, d: "Garante criptografia, não a honestidade do dono."}
            ],
            senior: [
                {q: "Mito ou Verdade: Se um neto pede PIX por número novo, confirme por vídeo.", a: true, d: "É a melhor forma de evitar o golpe do perfil clonado."},
                {q: "Mito ou Verdade: Antivírus no celular é perda de tempo.", a: false, d: "Malwares também atacam dispositivos móveis modernos."}
            ]
        };

        let currentSet = [];
        let idx = 0;
        let score = 0;

        function changeScreen(hide, show) {
            document.getElementById(hide).classList.add('hidden');
            document.getElementById(show).classList.remove('hidden');
        }

        function startLevel(lvl) {
            currentSet = QUESTIONS[lvl];
            idx = 0;
            score = 0;
            changeScreen('scr-levels', 'scr-quiz');
            showQuestion();
        }

        function showQuestion() {
            const q = currentSet[idx];
            document.getElementById('p-fill').style.width = `${(idx / currentSet.length) * 100}%`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-btns').classList.remove('hidden');
            document.getElementById('q-feedback').style.display = 'none';
        }

        function handleAnswer(choice) {
            const q = currentSet[idx];
            const correct = choice === q.a;
            if(correct) score++;

            document.getElementById('q-btns').classList.add('hidden');
            const f = document.getElementById('q-feedback');
            f.style.display = 'block';
            f.style.background = correct ? '#ecfdf5' : '#fef2f2';
            f.style.color = correct ? '#065f46' : '#991b1b';
            document.getElementById('f-msg').innerHTML = `<h3>${correct ? 'CORRETO!' : 'ERROU!'}</h3><p style="font-size:0.9rem; margin-top:5px;">${q.d}</p>`;
        }

        function nextStep() {
            idx++;
            if(idx < currentSet.length) {
                showQuestion();
            } else {
                finish();
            }
        }

        function finish() {
            changeScreen('scr-quiz', 'scr-end');
            document.getElementById('f-score').innerText = score;
            document.getElementById('f-quote').innerText = score === currentSet.length ? "TÉCNICA PERFEITA! VOCÊ ESTÁ BLINDADO." : "BOM TREINO, MAS PRECISA DE MAIS DEFINIÇÃO.";
        }
    </script>
</body>
</html>
