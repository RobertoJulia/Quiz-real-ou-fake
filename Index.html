<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Defense | Security Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #0f172a; 
            --accent: #3b82f6;
            --success: #10b981; 
            --danger: #ef4444; 
            --bg: #f8fafc; 
            --panel: #ffffff;
            --text: #1e293b;
            --radius: 24px;
        }

        .high-contrast {
            --bg: #000; --panel: #111; --text: #fff; --accent: #fbbf24; --success: #4ade80; --danger: #f87171;
        }

        .large-text * { font-size: 1.1rem !important; }
        .large-text h1 { font-size: 2.2rem !important; }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; color: var(--text); padding: 15px; transition: all 0.3s;
        }

        .container {
            background: var(--panel); width: 100%; max-width: 500px;
            padding: 35px; border-radius: var(--radius); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            text-align: center; position: relative; overflow: hidden;
        }

        /* Botão Acessibilidade Flutuante */
        .acc-trigger {
            position: absolute; top: 15px; right: 15px; background: #f1f5f9; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }

        /* Modal Acessibilidade */
        .modal {
            position: absolute; inset: 0; background: var(--panel); z-index: 200;
            display: flex; flex-direction: column; padding: 30px; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal.open { transform: translateY(0); }

        .acc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .acc-option {
            padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; background: none;
            color: var(--text); font-weight: 700; cursor: pointer; font-size: 0.8rem;
        }
        .acc-option.active { border-color: var(--accent); background: #eff6ff; color: var(--accent); }

        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 25px; font-size: 0.9rem; line-height: 1.5; }

        .btn {
            border: none; border-radius: 16px; cursor: pointer; font-weight: 700; 
            padding: 18px; width: 100%; margin-top: 10px; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-main { background: var(--accent); color: #fff; }
        .btn-sec { background: #f1f5f9; color: var(--primary); }
        .btn-true { background: var(--success); color: #fff; }
        .btn-false { background: var(--danger); color: #fff; }

        .hidden { display: none !important; }

        .q-icon { font-size: 4rem; margin-bottom: 10px; display: block; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s; }

        .feedback-card {
            margin-top: 20px; padding: 25px; border-radius: 20px; text-align: left;
            background: #f8fafc; border: 2px solid #e2e8f0;
        }
        
        .learn-more-box {
            margin-top: 15px; padding: 15px; background: #fff; border-radius: 12px;
            border-left: 4px solid var(--accent); font-size: 0.85rem; display: none;
        }

        .summary-box {
            text-align: left; background: #eff6ff; padding: 20px; border-radius: 15px; margin: 20px 0;
            border-left: 5px solid var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <button class="acc-trigger" id="open-acc">⚙️</button>

    <!-- Modal de Acessibilidade -->
    <div class="modal" id="acc-modal">
        <h1>Acessibilidade</h1>
        <p class="subtitle">Personalize sua experiência técnica:</p>
        <div class="acc-grid">
            <button class="acc-option" id="opt-voice">🔊 VOZ: ON</button>
            <button class="acc-option" id="opt-sound">🎵 SONS: ON</button>
            <button class="acc-option" id="opt-contrast">👁️ CONTRASTE</button>
            <button class="acc-option" id="opt-text">➕ TEXTO MAIOR</button>
        </div>
        <button class="btn btn-main" style="margin-top: auto;" id="close-acc">FECHAR</button>
    </div>

    <!-- HOME -->
    <div id="v-home">
        
        <span class="q-icon">🛡️</span>
        <h1>Cyber Brain</h1>
        <p class="subtitle">Identifique e destrua desinformações digitais específicas para a sua geração.</p>
        <button class="btn btn-main" id="nav-age">COMEÇAR ANÁLISE</button>
        <button class="btn btn-sec" id="nav-info">SOBRE OS GOLPES</button>
    </div>

    <!-- AGE SELECT -->
    <div id="v-age" class="hidden">
        <h1>Seu Perfil</h1>
        <p class="subtitle">Escolha sua faixa etária para filtrar as ameaças:</p>
        <button class="btn btn-main btn-age" data-age="teen" style="background:#6366f1">10 A 18 ANOS</button>
        <button class="btn btn-main btn-age" data-age="adult" style="background:#4f46e5">19 A 35 ANOS</button>
        <button class="btn btn-main btn-age" data-age="senior" style="background:#3730a3">36 ANOS+</button>
        <button class="btn btn-sec" onclick="showView('v-home')">VOLTAR</button>
    </div>

    <!-- QUIZ -->
    <div id="v-quiz" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
        <div id="q-text" style="font-size: 1.25rem; font-weight: 800; min-height: 100px; margin-bottom: 20px;"></div>
        
        <div id="q-actions">
            <button class="btn btn-true" id="ans-true">VERDADEIRO</button>
            <button class="btn btn-false" id="ans-false">FALSO</button>
        </div>

        <div id="q-feedback" class="hidden feedback-card">
            <h3 id="f-title"></h3>
            <p id="f-desc" style="margin: 10px 0; font-size: 0.9rem;"></p>
            <button class="btn btn-sec" id="btn-more" style="padding: 10px; font-size: 0.8rem;">➕ SABER MAIS TÉCNICO</button>
            <div class="learn-more-box" id="more-box"></div>
            <button class="btn btn-main" id="q-next">PRÓXIMO</button>
        </div>
    </div>

    <!-- END -->
    <div id="v-end" class="hidden">
        <span class="q-icon">📊</span>
        <h1>Resumo de Defesa</h1>
        <div class="summary-box" id="end-summary"></div>
        <button class="btn btn-main" onclick="location.reload()">REINICIAR</button>
    </div>
</div>

<script>
    const state = { voice: true, sounds: true, contrast: false, largeText: false, score: 0, idx: 0, pool: [], age: "" };

    const AudioEngine = {
        ctx: null,
        init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        play(f, t, d, v) {
            if(!state.sounds || !this.ctx) return;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + d);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + d);
        },
        click() { this.play(800, 'sine', 0.1, 0.1); },
        success() { this.play(500, 'sine', 0.1, 0.1); setTimeout(() => this.play(1000, 'sine', 0.2, 0.1), 80); },
        error() { this.play(200, 'sawtooth', 0.3, 0.05); }
    };

    const DB = {
        teen: {
            questions: [
                { q: "Mito: 'Usar Wi-Fi público de aeroporto para logar no Discord é seguro se você usar aba anônima.'", a: false, r: "Falso. A aba anônima não criptografa seu tráfego de rede.", m: "Em redes abertas, atacantes podem usar 'Sniffing' para capturar pacotes de dados. Use sempre uma VPN ou seus dados móveis para logins sensíveis." },
                { q: "Mito: 'Baixar arquivos .exe de servidores do Discord para ganhar 'Nitro grátis' é um risco aceitável.'", a: false, r: "Falso. É a forma mais comum de roubo de tokens.", m: "Esses arquivos são 'Token Loggers'. Eles copiam a chave de acesso da sua conta e permitem que o invasor entre sem precisar da sua senha ou do 2FA." }
            ],
            summary: "Para adolescentes, a maior desinformação é acreditar que a agilidade digital significa segurança. O foco deve ser em não confiar em 'presentes' digitais e entender que redes públicas são transparentes para hackers."
        },
        adult: {
            questions: [
                { q: "Mito: 'Criptomoedas enviadas por engano para sua carteira que exigem uma taxa para serem 'desbloqueadas' são reais.'", a: false, r: "Falso. Isso é um golpe de 'Dusting Attack' ou taxa de avanço.", m: "Criminosos enviam tokens falsos que parecem valiosos. Ao tentar interagir com o contrato inteligente deles, você dá permissão para que limpem sua carteira real." },
                { q: "Mito: 'O cadeado no site garante que a empresa por trás dele é legítima e honesta.'", a: false, r: "Falso. Garante apenas que a conexão é criptografada.", m: "Hoje, qualquer site de golpe pode obter um certificado SSL gratuito. O cadeado diz que a 'conversa' é privada, mas você pode estar conversando com um bandido." }
            ],
            summary: "Jovens adultos caem em golpes de ganância e FOMO (medo de ficar de fora). A desinformação aqui gira em torno de investimentos milagrosos e a falsa autoridade de perfis verificados."
        },
        senior: {
            questions: [
                { q: "Mito: 'Se o seu banco liga e pede para você digitar sua senha no teclado do telefone para 'confirmar' algo, é seguro.'", a: false, r: "Falso. Bancos nunca pedem senhas via telefone.", m: "Ataque de 'Vishing' (Voice Phishing). Criminosos usam softwares que simulam o número real do banco (Spoofing) para ganhar sua confiança." },
                { q: "Mito: 'Mensagens de parentes pedindo dinheiro urgente no WhatsApp são sempre verdadeiras se a foto for deles.'", a: false, r: "Falso. Fotos são públicas, contas são clonadas.", m: "Antes de qualquer transferência, faça uma ligação de vídeo ou peça um áudio falando uma palavra específica. Nunca confie apenas em mensagens de texto." }
            ],
            summary: "Para o público sênior, a desinformação explora o medo e a urgência. O segredo é quebrar o ciclo de pressupostos e sempre verificar por um canal secundário de comunicação."
        }
    };

    function showView(id) {
        document.querySelectorAll('.container > div:not(.modal):not(.acc-trigger)').forEach(v => v.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function speak(txt) {
        if(!state.voice) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(txt);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }

    window.onload = () => {
        AudioEngine.init();

        // ACESSIBILIDADE MODAL
        document.getElementById('open-acc').onclick = () => { AudioEngine.click(); document.getElementById('acc-modal').classList.add('open'); };
        document.getElementById('close-acc').onclick = () => { AudioEngine.click(); document.getElementById('acc-modal').classList.remove('open'); };

        document.getElementById('opt-voice').onclick = (e) => {
            state.voice = !state.voice;
            e.target.classList.toggle('active', !state.voice);
            e.target.innerText = state.voice ? "🔊 VOZ: ON" : "🔇 VOZ: OFF";
            AudioEngine.click();
        };

        document.getElementById('opt-sound').onclick = (e) => {
            state.sounds = !state.sounds;
            e.target.classList.toggle('active', !state.sounds);
            e.target.innerText = state.sounds ? "🎵 SONS: ON" : "🔇 SONS: OFF";
            if(state.sounds) AudioEngine.click();
        };

        document.getElementById('opt-contrast').onclick = (e) => {
            state.contrast = !state.contrast;
            document.body.classList.toggle('high-contrast', state.contrast);
            e.target.classList.toggle('active', state.contrast);
            AudioEngine.click();
        };

        document.getElementById('opt-text').onclick = (e) => {
            state.largeText = !state.largeText;
            document.body.classList.toggle('large-text', state.largeText);
            e.target.classList.toggle('active', state.largeText);
            AudioEngine.click();
        };

        // NAV
        document.getElementById('nav-age').onclick = () => { AudioEngine.click(); showView('v-age'); };

        document.querySelectorAll('.btn-age').forEach(btn => {
            btn.onclick = () => {
                AudioEngine.click();
                state.age = btn.dataset.age;
                state.pool = [...DB[state.age].questions].sort(() => Math.random() - 0.5);
                state.idx = 0; state.score = 0;
                showView('v-quiz');
                renderQ();
            };
        });

        function renderQ() {
            const q = state.pool[state.idx];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('fill').style.width = `${(state.idx/state.pool.length)*100}%`;
            document.getElementById('q-feedback').classList.add('hidden');
            document.getElementById('q-actions').classList.remove('hidden');
            document.getElementById('more-box').style.display = 'none';
            speak(q.q);
        }

        const handleAns = (val) => {
            const q = state.pool[state.idx];
            const correct = val === q.a;
            document.getElementById('q-actions').classList.add('hidden');
            document.getElementById('q-feedback').classList.remove('hidden');
            
            if(correct) {
                state.score += 100; AudioEngine.success();
                document.getElementById('f-title').innerText = "VULNERABILIDADE BLOQUEADA";
                document.getElementById('f-title').style.color = "var(--success)";
            } else {
                AudioEngine.error();
                document.getElementById('f-title').innerText = "SISTEMA COMPROMETIDO";
                document.getElementById('f-title').style.color = "var(--danger)";
            }
            document.getElementById('f-desc').innerText = q.r;
            document.getElementById('more-box').innerText = q.m;
            speak(document.getElementById('f-title').innerText + ". " + q.r);
        };

        document.getElementById('ans-true').onclick = () => handleAns(true);
        document.getElementById('ans-false').onclick = () => handleAns(false);

        document.getElementById('btn-more').onclick = () => {
            AudioEngine.click();
            const box = document.getElementById('more-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            if(box.style.display === 'block') speak(box.innerText);
        };

        document.getElementById('q-next').onclick = () => {
            AudioEngine.click();
            state.idx++;
            if(state.idx < state.pool.length) renderQ();
            else {
                showView('v-end');
                document.getElementById('end-summary').innerHTML = `
                    <h3 style="color:var(--accent); margin-bottom:10px;">Análise para ${state.age.toUpperCase()}:</h3>
                    <p style="font-size:0.9rem; line-height:1.6;">${DB[state.age].summary}</p>
                    <p style="margin-top:15px; font-weight:800;">Pontuação Final: ${state.score} pts</p>
                `;
                speak("Análise concluída. Veja o seu resumo de defesa.");
            }
        };

        document.getElementById('nav-info').onclick = () => {
            AudioEngine.click();
            alert("Explore o simulador escolhendo uma idade. Cada pergunta respondida libera informações técnicas profundas sobre como os golpes operam.");
        };
    };
</script>
</body>
</html>
